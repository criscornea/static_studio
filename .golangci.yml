version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - sloglint
    - unconvert
  exclusions:
    paths:
      - web/node_modules
    rules:
      - path: _test\.go
        linters:
          - gosec
          - bodyclose
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true

formatters:
  exclusions:
    paths:
      - web/node_modules
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/criscornea/static_studio
